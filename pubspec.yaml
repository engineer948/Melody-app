name: melody
description: "Jellyfin-first multi-source music player"
publish_to: 'none'
version: 0.9.0+15

environment:
  sdk: ^3.13.7

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  cached_network_image: ^4.0.6
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_blurhash: ^0.9.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  meta: ^1.19.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.8
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  xml: ^7.1.0
  zxing2: ^0.2.4

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.10
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/licenses/
  # Variable fonts: Flutter maps FontWeight onto the weight axis.
  fonts:
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest.ttf
    - family: AlbertSans
      fonts:
        - asset: assets/fonts/AlbertSans.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend.ttf
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa.ttf
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf

# Build SQLite from the vendored official amalgamation instead of
# downloading precompiled binaries, so F-Droid can build from source.
hooks:
  user_defines:
    sqlite3:
      source: source
      path: third_party/sqlite/sqlite3.c
