# Draft F-Droid build recipe. Copy it to metadata/io.github.engineer948.melody.yml in a
# fork of https://gitlab.com/fdroid/fdroiddata (see docs/FDROID.md).
# Check with `fdroid lint` and `fdroid build` before opening the merge request.
Categories:
  - Multimedia
License: MIT
AuthorName: engineer948
SourceCode: https://github.com/engineer948/Melody-app
IssueTracker: https://github.com/engineer948/Melody-app/issues
Changelog: https://github.com/engineer948/Melody-app/releases

AutoName: Melody

AntiFeatures:
  NonFreeNet:
    en-US: The optional built-in Tailscale node talks to Tailscale's coordination
      server when the user joins a network with an invite.

RepoType: git
Repo: https://github.com/engineer948/Melody-app.git

Builds:
  - versionName: 0.28.2
    versionCode: 45
    commit: v0.28.2
    output: build/app/outputs/flutter-apk/app-release.apk
    srclibs:
      - flutter@3.47.9
    sudo:
      # The official Go release named in native/tailscale/go.mod, checked
      # against its published SHA-256 (no toolchain download at build).
      - curl -fsSLo /tmp/go.tar.gz https://dl.google.com/go/go1.27.4.linux-amd64.tar.gz
      - echo "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840  /tmp/go.tar.gz"
        | sha256sum -c -
      - rm -rf /usr/local/go
      - tar -C /usr/local -xzf /tmp/go.tar.gz
    ndk: r28c
    rm:
      - ios
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
      - .gopath
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export PATH=/usr/local/go/bin:$PATH
      - export GOPATH=$(pwd)/.gopath GOTOOLCHAIN=local
      - export ANDROID_NDK_HOME=$$NDK$$
      - tool/build_tailscale.sh
      - export MELODY_UNSIGNED=1
      - $$flutter$$/bin/flutter build apk --release --dart-define=MELODY_DISTRIBUTION=fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 0.28.2
CurrentVersionCode: 45
