name: Release

# Pushing a tag such as v0.5.0 builds the APKs, signs them with the key kept
# in the repository secrets (MELODY_KEYSTORE, MELODY_KEYSTORE_PASSWORD) and
# attaches them to a GitHub release right away. Afterwards the universal APK
# is built again the way F-Droid's build server builds it
# (tool/fdroid_build.sh), signed with our key and swapped into the same
# release, so F-Droid can reproduce it and ship it with our signature.
# It can also be started by hand (Actions → Release → Run workflow): the tag
# v<version from pubspec.yaml> is then created on the chosen branch.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          line=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          name=${line%%+*}
          code=${line##*+}
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $name"
            exit 1
          fi
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/tailscale/go.mod
          cache-dependency-path: native/tailscale/go.sum
      - name: Android NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Build the Tailscale library
        run: tool/build_tailscale.sh
      - name: Signing key from secrets
        env:
          KEYSTORE: ${{ secrets.MELODY_KEYSTORE }}
          PASSWORD: ${{ secrets.MELODY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the MELODY_KEYSTORE and MELODY_KEYSTORE_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE" | tr -d ' \n\r' | base64 -d > android/melody.jks
          {
            echo "storeFile=melody.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=melody"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties
      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Collect APKs
        run: |
          out=build/app/outputs/flutter-apk
          v=${{ steps.version.outputs.name }}
          mkdir dist
          cp $out/app-release.apk dist/melody-$v.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp $out/app-$abi-release.apk dist/melody-$v-$abi.apk
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=fastlane/metadata/android/en-US/changelogs/${{ steps.version.outputs.code }}.txt
          [ -f "$notes" ] || echo "Melody ${{ steps.version.outputs.name }}" > "$notes"
          tag=${{ steps.version.outputs.tag }}
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" \
              --title "Melody ${{ steps.version.outputs.name }}" \
              --notes-file "$notes"
          fi

  fdroid:
    name: Universal APK (F-Droid build)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build in the F-Droid buildserver image
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src" -v "$PWD/out:/out" \
            registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
            bash /src/tool/fdroid_build.sh "$GITHUB_SHA" /out
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: out/*.apk

  fdroid-publish:
    name: Sign the F-Droid build and swap it in
    needs: fdroid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: unsigned
          path: unsigned
      - name: Sign and check the certificate
        env:
          KEYSTORE: ${{ secrets.MELODY_KEYSTORE }}
          PASSWORD: ${{ secrets.MELODY_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/melody.jks"
          tools=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/melody.jks" --ks-key-alias melody \
            --ks-pass env:PASSWORD --key-pass env:PASSWORD \
            --out universal.apk unsigned/*.apk
          rm "$RUNNER_TEMP/melody.jks"
          "$tools/apksigner" verify --print-certs universal.apk \
            | grep -q 28a0ba96918e8a33a3f168b94a41611439b201f380f9e907129cf0504d6342c6
      - name: Replace the universal APK and the checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          line=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          v=${line%%+*}
          mkdir dist
          gh release download "v$v" --pattern '*.apk' --dir dist
          cp universal.apk "dist/melody-$v.apk"
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          gh release upload "v$v" "dist/melody-$v.apk" dist/SHA256SUMS.txt --clobber

