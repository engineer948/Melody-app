name: Release

# Pushing a tag such as v0.5.0 builds the APKs, signs them with the key kept
# in the repository secrets (MELODY_KEYSTORE, MELODY_KEYSTORE_PASSWORD) and
# attaches them to a GitHub release. F-Droid builds and signs its own APK
# from the same tag.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: version
        run: |
          line=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          name=${line%%+*}
          code=${line##*+}
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Signing key from secrets
        env:
          KEYSTORE: ${{ secrets.MELODY_KEYSTORE }}
          PASSWORD: ${{ secrets.MELODY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$PASSWORD" ]; then
            echo "::error::Add the MELODY_KEYSTORE and MELODY_KEYSTORE_PASSWORD secrets"
            exit 1
          fi
          echo "$KEYSTORE" | tr -d ' \n\r' | base64 -d > android/melody.jks
          {
            echo "storeFile=melody.jks"
            echo "storePassword=$PASSWORD"
            echo "keyAlias=melody"
            echo "keyPassword=$PASSWORD"
          } > android/key.properties
      - name: Build APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
      - name: Collect APKs
        run: |
          out=build/app/outputs/flutter-apk
          v=${{ steps.version.outputs.name }}
          mkdir dist
          cp $out/app-release.apk dist/melody-$v.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp $out/app-$abi-release.apk dist/melody-$v-$abi.apk
          done
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=fastlane/metadata/android/tr-TR/changelogs/${{ steps.version.outputs.code }}.txt
          [ -f "$notes" ] || echo "Melody ${{ steps.version.outputs.name }}" > "$notes"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Melody ${{ steps.version.outputs.name }}" \
              --notes-file "$notes"
          fi
