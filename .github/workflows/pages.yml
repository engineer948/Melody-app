name: Website

# Publishes site/ (with the app icon and screenshots) to GitHub Pages.
# Needs Settings → Pages → Source: "GitHub Actions" once.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/icon.png
      - fastlane/metadata/android/en-US/images/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/screenshots
          cp site/* _site/
          cp docs/icon.png _site/icon.png
          cp fastlane/metadata/android/en-US/images/phoneScreenshots/*.png _site/screenshots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
